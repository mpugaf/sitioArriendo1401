<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR - Sitio Arriendo 1401</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #17a2e8, #0b74b0);
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    h1 {
      color: #0b2a3d;
      margin-top: 0;
      font-size: 24px;
    }
    p {
      color: #4d7086;
      margin: 10px 0;
      font-size: 14px;
    }
    #qrcode {
      margin: 30px 0;
      padding: 20px;
      background: white;
      border: 2px solid #17a2e8;
      border-radius: 8px;
      display: inline-block;
    }
    .url {
      color: #17a2e8;
      font-weight: bold;
      word-break: break-all;
      font-size: 12px;
      margin: 20px 0;
    }
    button {
      background: linear-gradient(135deg, #17a2e8, #0b74b0);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(23, 162, 232, 0.3);
    }
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Código QR</h1>
    <p>Departamento con terraza en General Jofré</p>

    <div id="qrcode"></div>

    <p class="url">https://sitioarriendo.vercel.app/</p>

    <button onclick="downloadQR()">Descargar QR</button>
  </div>

  <script>
    const url = 'https://sitioarriendo.vercel.app/';

    // Generar QR
    new QRCode(document.getElementById('qrcode'), {
      text: url,
      width: 300,
      height: 300,
      colorDark: '#0b2a3d',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    function downloadQR() {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) {
        alert('Esperando a que se genere el QR...');
        return;
      }

      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = 'qr-sitioarriendo1401.png';
      link.click();
    }
  </script>
</body>
</html>
